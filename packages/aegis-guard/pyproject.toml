[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-guard"
version = "0.1.0"
description = "Deterministic safety gateway and guardrails library for MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Aegis Team" }
]
dependencies = [
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_guard"]
